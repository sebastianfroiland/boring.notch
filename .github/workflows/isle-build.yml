name: Isle build (unsigned)

# Compile check for the fork's feature branches. No signing, no secrets.
on:
  push:
    branches:
      - 'claude/**'
      - 'isle/**'
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-latest:
    name: macos-latest (newest Xcode, Liquid Glass path)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select newest stable Xcode
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app || true
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE 'beta|rc' | sort -V | tail -n1 || true)
          if [[ -n "${XCODE}" ]]; then sudo xcode-select -s "${XCODE}"; fi
          xcodebuild -version
          swift --version
          sw_vers

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project boringNotch.xcodeproj -scheme boringNotch \
            -skipPackagePluginValidation -skipMacroValidation

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project boringNotch.xcodeproj \
            -scheme boringNotch \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            | tee build.log | grep -E "error:|warning: .*Isle|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-log-latest
          path: build.log
          if-no-files-found: ignore

  build-xcode16:
    name: macos-15 (Xcode 16, black fallback path)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 16
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | grep -viE 'beta|rc' | sort -V | tail -n1 || true)
          if [[ -n "${XCODE}" ]]; then sudo xcode-select -s "${XCODE}"; fi
          xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project boringNotch.xcodeproj \
            -scheme boringNotch \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-log-xcode16
          path: build.log
          if-no-files-found: ignore
